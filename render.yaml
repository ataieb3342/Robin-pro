# Blueprint Render — site statique, aucune compilation.
# Render > New > Blueprint > pointer sur ce dépôt.
services:
  - name: plomberie-plantiveau
    type: web
    runtime: static
    buildCommand: echo "site statique, rien a compiler"
    staticPublishPath: ./public
    routes:
      # Une seule page : toute URL inconnue la sert plutôt qu'un 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
